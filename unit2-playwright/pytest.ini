[pytest]
testpaths = tests
pythonpath = . tests
# Inherited from Unit 1: the SAME Gherkin feature files (copied into tests/features/) are the executable specification.
bdd_features_base_dir = tests/features
# Day 6: tracing, screenshots and video are kept only for failed tests; HTML + JUnit reports every run.
addopts =
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --video retain-on-failure
    --output test-results
    --html=reports/report.html --self-contained-html
    --junitxml=reports/junit.xml
    -m "not auth and not data-creating and not manual and not wip"
base_url = https://sauce-demo.myshopify.com
# Gherkin tags (@R01, @critical ...) become pytest markers; plain tests use the same names (pytest.mark.R09).
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
markers =
    smoke: minimum flow, run on every deploy
    regression: full automated suite, run nightly
    critical: risk level Critical (score >= 15)
    high: risk level High (10-14)
    medium: risk level Medium (6-9)
    negative: negative case
    network: uses network interception or throttling
    auth: needs a real customer account (SAUCE_EMAIL / SAUCE_PASSWORD)
    allow_third_party: do not block third-party requests for this test
